mnehsy94TdNDxfH/K6f+x5Jf71f/T1pObgQAAA==') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root{
  --bg:#03050f;--panel:#070d1e;--card:#0c1428;--raised:#111e38;--border:#1a2d52;--border2:#0f1e3a;
  --cyan:#00c8ff;--cyan2:#0099dd;--cyan3:#006699;
  --gold:#d4a23c;--gold2:#f0c96a;
  --orange:#ff6b35;--green:#00e87a;--purple:#8b5cf6;--amber:#fbbf24;--red:#ff4757;--blue:#3b82f6;
  --text:#e8f4ff;--muted:#a8c8ff;--dim:#6a8acf;
  --shadow:0 8px 32px rgba(0,0,0,.55);
  --r:16px;--rs:10px;--t:.18s cubic-bezier(.4,0,.2,1);
  --nav-h:64px;--bar-h:56px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{--bg:var(--light-bg,#eef2fb);--panel:var(--light-panel,#ffffff);--card:var(--light-card,#ffffff);--raised:var(--light-raised,#f0f4ff);--border:var(--light-border,#cdd8f2);--border2:var(--light-border2,#dde5f7);--text:var(--light-text,#0f172a);--muted:var(--light-muted,#48597e);--dim:var(--light-dim,#93a3c4);--shadow:0 8px 24px rgba(30,50,100,.12);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-top:calc(var(--bar-h) + var(--sat));padding-bottom:calc(var(--nav-h) + var(--sab) + 8px);overscroll-behavior-y:contain;}
::selection{background:rgba(0,200,255,.25);}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:var(--cyan3);border-radius:2px;}::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;vertical-align:-4px;}
.ico.sm{width:16px;height:16px;}.ico.lg{width:26px;height:26px;}.ico.xl{width:34px;height:34px;}
.mono{font-family:'JetBrains Mono',monospace;}
/* ── App bar ── */
#appbar{position:fixed;top:0;left:0;right:0;height:calc(var(--bar-h) + var(--sat));padding:var(--sat) 14px 0;background:rgba(7,13,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px;z-index:100;}
[data-theme="light"] #appbar{background:rgba(255,255,255,.9);}
.brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--cyan3),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;color:#000510;flex-shrink:0;}
#barTitle{font-size:1rem;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#barClock{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);}
.net-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0;}
.net-dot.off{background:var(--red);animation:none;}
.bar-btn{width:38px;height:38px;border-radius:50%;background:var(--raised);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--t);flex-shrink:0;}
.bar-btn:active{transform:scale(.92);color:var(--cyan);border-color:var(--cyan);}
/* ── Bottom nav ── */
#bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);background:rgba(7,13,30,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border2);display:flex;align-items:stretch;z-index:120;}
[data-theme="light"] #bottomnav{background:rgba(255,255,255,.95);}
.nav-tab{flex:1;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;cursor:pointer;position:relative;transition:color var(--t);}
.nav-tab.active{color:var(--cyan);}
.nav-tab:active{transform:scale(.94);}
.nav-tab .nbadge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:.56rem;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
#fabBtn{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--cyan3),var(--cyan));color:#001018;border:none;display:flex;align-items:center;justify-content:center;margin:-18px 6px 0;align-self:flex-start;box-shadow:0 6px 20px rgba(0,200,255,.35);cursor:pointer;flex-shrink:0;}
#fabBtn:active{transform:scale(.92);}
/* ── View / layout ── */
#view{padding:16px 14px 24px;max-width:1100px;margin:0 auto;}
.page-head{margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.page-title{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;}
.page-sub{font-size:.76rem;color:var(--muted);margin-top:2px;width:100%;}
.card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
.card-title{font-size:.85rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(min-width:700px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:5px;border-top:3px solid var(--cyan);cursor:pointer;transition:transform var(--t);}
.kpi:active{transform:scale(.97);}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:1.45rem;font-weight:700;line-height:1;}
.kpi-lbl{font-size:.68rem;font-weight:600;color:var(--text);}
.kpi-sub{font-size:.62rem;color:var(--muted);}
/* ── List rows ── */
.row{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:12px 13px;margin-bottom:9px;display:flex;flex-direction:column;gap:7px;animation:fadeIn .18s ease;}
.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;}
.row-title{font-size:.9rem;font-weight:700;line-height:1.3;}
.row-sub{font-size:.75rem;color:var(--muted);line-height:1.5;word-break:break-word;}
.row-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.row-acts{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;}
.empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:.84rem;}
.empty .ico{width:38px;height:38px;opacity:.4;display:block;margin:0 auto 10px;}
/* ── Badges / chips ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.b-success{background:rgba(0,232,122,.14);color:var(--green);}
.b-warn{background:rgba(251,191,36,.14);color:var(--amber);}
.b-danger{background:rgba(255,71,87,.14);color:var(--red);}
.b-info{background:rgba(0,200,255,.14);color:var(--cyan);}
.b-gold{background:rgba(212,162,60,.14);color:var(--gold);}
.b-purple{background:rgba(139,92,246,.14);color:var(--purple);}
.b-orange{background:rgba(255,107,53,.14);color:var(--orange);}
.b-dim{background:rgba(107,140,186,.12);color:var(--muted);}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all var(--t);}
.chip.active{background:rgba(0,200,255,.12);border-color:var(--cyan);color:var(--cyan);}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--rs);font-size:.8rem;font-weight:700;cursor:pointer;border:none;transition:all var(--t);min-height:40px;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,var(--cyan3),var(--cyan2));color:#001018;}
.btn-gold{background:linear-gradient(135deg,#7a5a1a,var(--gold));color:#1a0e00;}
.btn-sec{background:var(--raised);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:rgba(255,71,87,.14);border:1px solid rgba(255,71,87,.3);color:var(--red);}
.btn-success{background:rgba(0,232,122,.13);border:1px solid rgba(0,232,122,.3);color:var(--green);}
.btn-sm{padding:7px 12px;font-size:.72rem;min-height:34px;}
.btn-icon{width:38px;height:38px;padding:0;background:var(--raised);border:1px solid var(--border);color:var(--muted);border-radius:var(--rs);}
.btn-icon:active{color:var(--cyan);border-color:var(--cyan);}
.btn-block{width:100%;}
/* ── Search ── */
.searchbar{position:relative;margin-bottom:10px;}
.searchbar input{width:100%;padding:11px 14px 11px 40px;background:var(--raised);border:1px solid var(--border);border-radius:24px;color:var(--text);font-size:.85rem;}
.searchbar input:focus{outline:none;border-color:var(--cyan);}
.searchbar .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);}
/* ── Forms ── */
.f-group{margin-bottom:13px;}
.f-label{display:block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px;}
.f-group input,.f-group select,.f-group textarea{width:100%;padding:11px 13px;background:var(--raised);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:.9rem;font-family:inherit;min-height:44px;}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,200,255,.12);}
.f-group textarea{min-height:72px;resize:vertical;}
.f-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* ── Progress ── */
.prog{width:100%;height:7px;background:var(--raised);border-radius:4px;overflow:hidden;}
.prog>div{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan3),var(--cyan));transition:width .5s ease;}
/* ── Boards (kanban) ── */
.board{display:flex;gap:11px;overflow-x:auto;padding-bottom:14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.b-col{min-width:78vw;max-width:330px;scroll-snap-align:center;background:var(--panel);border:1px solid var(--border2);border-radius:var(--r);flex-shrink:0;display:flex;flex-direction:column;}
@media(min-width:700px){.b-col{min-width:260px;}}
.b-col-h{padding:11px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border2);font-size:.78rem;font-weight:800;}
.b-col-body{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:90px;}
.b-col-body.drag-over{outline:2px dashed var(--cyan);outline-offset:-4px;border-radius:var(--rs);}
.b-card{background:var(--raised);border:1px solid var(--border);border-radius:var(--rs);padding:11px;display:flex;flex-direction:column;gap:6px;}
.b-card.dragging{opacity:.4;}
/* ── Roster ── */
.roster-scroll{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border2);-webkit-overflow-scrolling:touch;}
.roster-tbl{border-collapse:collapse;background:var(--card);}
.roster-tbl th{position:sticky;top:0;background:var(--raised);font-size:.58rem;text-transform:uppercase;color:var(--muted);padding:7px 6px;border:1px solid var(--border2);text-align:center;white-space:nowrap;}
.roster-tbl td{border:1px solid var(--border2);padding:3px;text-align:center;}
.roster-tbl td:first-child{position:sticky;left:0;background:var(--card);text-align:left;padding:5px 9px;white-space:nowrap;min-width:118px;z-index:2;}
.rname{font-size:.74rem;font-weight:700;}
.rdept{font-size:.6rem;color:var(--dim);}
.roster-person{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:166px;}
.roster-actions{display:flex;gap:5px;opacity:.88;flex-shrink:0;}
.roster-actions .btn-icon{width:28px;height:28px;min-height:28px;border-radius:8px;}
.roster-remove{color:var(--red);}
.roster-tbl tr:hover .roster-actions{opacity:1;}
.shift-cell{min-width:44px;height:44px;border-radius:6px;font-size:.64rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border2);background:var(--raised);color:var(--dim);user-select:none;}
.shift-cell:active{transform:scale(.9);}
/* ── OEE ring / machine ── */
.machine-grid{display:grid;grid-template-columns:1fr;gap:11px;}
@media(min-width:640px){.machine-grid{grid-template-columns:1fr 1fr;}}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.mstat{background:var(--raised);border-radius:var(--rs);padding:8px 6px;text-align:center;}
.mstat .v{font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;}
.mstat .l{font-size:.58rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;}
/* ── Bars (analytics) ── */
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.bar-lbl{width:108px;font-size:.7rem;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:9px;background:var(--raised);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;transition:width .6s ease;}
.bar-val{width:52px;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);text-align:right;flex-shrink:0;}
/* ── Sheets / modal ── */
.sheet-veil{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s ease;}
.sheet-veil.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--panel);border-radius:22px 22px 0 0;border:1px solid var(--border);border-bottom:none;z-index:210;transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,.3,1);display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--sab);}
.sheet.open{transform:translateY(0);}
.sheet-grip{width:42px;height:5px;border-radius:3px;background:var(--border);margin:9px auto 2px;flex-shrink:0;}
.sheet-h{padding:8px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);flex-shrink:0;}
.sheet-title{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:8px;}
.sheet-body{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet-foot{padding:12px 18px;border-top:1px solid var(--border2);display:flex;gap:9px;flex-shrink:0;}
.sheet-foot .btn{flex:1;}
@media(min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,105%);border-radius:22px;bottom:24px;border-bottom:1px solid var(--border);}.sheet.open{transform:translate(-50%,0);}}
/* ── Modules grid ── */
.mod-section{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:16px 0 8px;}
.mod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.mod-cell{background:var(--card);border-radius:var(--r);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--border2);color:var(--text);transition:all var(--t);position:relative;}
.mod-cell:active{transform:scale(.93);background:var(--raised);}
.mod-cell .ico{width:23px;height:23px;}
.mod-cell span{font-size:.6rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;}
.mod-cell .nbadge{position:absolute;top:5px;right:8px;background:var(--red);color:#fff;font-size:.55rem;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
/* ── Copilot ── */
#copilotSheet .sheet-body{display:flex;flex-direction:column;gap:9px;min-height:40vh;}
.cmsg{max-width:86%;padding:10px 13px;border-radius:14px;font-size:.83rem;line-height:1.55;word-wrap:break-word;white-space:pre-wrap;}
.cmsg.user{background:rgba(0,200,255,.12);border:1px solid rgba(0,200,255,.22);align-self:flex-end;}
.cmsg.bot{background:var(--raised);border:1px solid var(--border);align-self:flex-start;color:var(--muted);}
.cmsg.think{align-self:flex-start;color:var(--dim);font-style:italic;}
.cop-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border2);}
.cop-input input{flex:1;padding:11px 14px;background:var(--raised);border:1px solid var(--border);border-radius:22px;color:var(--text);font-size:.86rem;}
.cop-input input:focus{outline:none;border-color:var(--cyan);}
.sugg{display:flex;gap:7px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none;}
.sugg::-webkit-scrollbar{display:none;}
/* ── Toast ── */
#toasts{position:fixed;bottom:calc(var(--nav-h) + var(--sab) + 14px);left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none;}
.toast{background:var(--raised);border:1px solid var(--cyan3);color:var(--text);padding:12px 16px;border-radius:14px;font-size:.8rem;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px;animation:slideUp .22s ease;pointer-events:auto;}
.toast button{background:none;border:none;color:var(--cyan);font-weight:800;font-size:.78rem;cursor:pointer;padding:4px 6px;}
/* ── Lock screen ── */
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:900;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;}
#lockScreen.show{display:flex;}
.pin-dots{display:flex;gap:14px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--cyan3);}
.pin-dot.fill{background:var(--cyan);border-color:var(--cyan);}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:13px;margin-top:8px;}
.pin-key{height:64px;border-radius:50%;background:var(--raised);border:1px solid var(--border);color:var(--text);font-size:1.3rem;font-weight:700;cursor:pointer;}
.pin-key:active{background:var(--cyan3);}
/* ── Misc ── */
.divider{height:1px;background:var(--border2);margin:12px 0;}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--cyan3),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;color:#fff;flex-shrink:0;}
.skill-tag{background:var(--raised);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:.64rem;color:var(--muted);}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:700px){.quick-grid{grid-template-columns:repeat(4,1fr);}}
.two-col{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:840px){.two-col{grid-template-columns:1fr 1fr;}}
#installBanner{display:none;position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + var(--sab) + 12px);background:var(--panel);border:1px solid var(--cyan3);border-radius:16px;padding:13px 15px;z-index:150;align-items:center;gap:11px;box-shadow:var(--shadow);}
#installBanner.show{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media print{#appbar,#bottomnav,#fabBtn,.sheet,.sheet-veil{display:none!important}body{padding:0}}

/* ── Desktop sidebar ── */
#sidebar{display:none;position:fixed;left:0;top:calc(var(--bar-h) + var(--sat));bottom:0;width:220px;background:var(--panel);border-right:1px solid var(--border2);flex-direction:column;overflow-y:auto;z-index:90;padding-bottom:16px;}
[data-theme="light"] #sidebar{background:rgba(255,255,255,.97);}
.side-section{font-size:.55rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:14px 16px 4px;}
.side-link{display:flex;align-items:center;gap:9px;padding:9px 16px;color:var(--muted);font-size:.78rem;font-weight:600;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:all var(--t);position:relative;border-radius:0;}
.side-link:hover{background:var(--raised);color:var(--text);}
.side-link.active{background:rgba(0,200,255,.1);color:var(--cyan);}
.side-link.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--cyan);border-radius:0 2px 2px 0;}
.side-link .side-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.52rem;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
@media(min-width:1024px){
  body{padding-left:220px;}
  #bottomnav{left:220px;}
  #appbar{left:220px;}
  #sidebar{display:flex;flex-direction:column;}
  #view{max-width:1280px;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
  .two-col{grid-template-columns:1fr 1fr;}
  .mod-grid{grid-template-columns:repeat(6,1fr);}
  .quick-grid{grid-template-columns:repeat(4,1fr);}
}
@media(min-width:1280px){
  .kpi-grid{grid-template-columns:repeat(6,1fr);}
}

/* ── Card hover polish ── */
.card:hover{border-color:var(--border);}
.row{transition:background var(--t),border-color var(--t);}
.row:hover{background:var(--raised);border-color:var(--border);}
.kpi:hover{border-top-color:var(--cyan2);background:var(--raised);}

/* ── Email module ── */
.email-layout{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:840px){.email-layout{grid-template-columns:280px 1fr;align-items:start;}}
.email-panel{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.email-list{display:flex;flex-direction:column;}
.email-item{padding:12px 14px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background var(--t);display:flex;gap:10px;align-items:flex-start;}
.email-item:last-child{border-bottom:none;}
.email-item:hover{background:var(--raised);}
.email-item.active{background:rgba(0,200,255,.08);border-left:3px solid var(--cyan);}
.email-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem;flex-shrink:0;}
.email-sender{font-size:.8rem;font-weight:600;color:var(--text);line-height:1.2;}
.email-subject{font-size:.76rem;color:var(--muted);line-height:1.3;margin-top:1px;}
.email-item.unread .email-sender{font-weight:800;}
.email-item.unread .email-subject{color:var(--text);font-weight:700;}
.email-preview{font-size:.68rem;color:var(--dim);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
.email-time{font-size:.6rem;color:var(--dim);white-space:nowrap;flex-shrink:0;}
.email-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);flex-shrink:0;margin-top:6px;}
.email-body-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.email-body-header{padding:18px 20px 14px;border-bottom:1px solid var(--border2);}
.email-body-subject{font-size:1.05rem;font-weight:800;margin-bottom:10px;line-height:1.3;}
.email-body-meta{font-size:.75rem;color:var(--muted);line-height:1.8;}
.email-body-meta strong{color:var(--text);}
.email-body-actions{padding:12px 20px;border-bottom:1px solid var(--border2);display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);}
.email-body-text{padding:20px;font-size:.87rem;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--text);}
.email-empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.email-empty-state .ico{width:42px;height:42px;opacity:.3;margin:0 auto 12px;display:block;}
.template-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:15px;cursor:pointer;transition:all var(--t);border-top:3px solid transparent;}
.template-card:hover{border-color:var(--cyan);border-top-color:var(--cyan);background:var(--raised);}
.template-name{font-size:.87rem;font-weight:800;margin-bottom:5px;}
.template-subject{font-size:.73rem;color:var(--muted);line-height:1.4;}

/* ── Better tablet layout ── */
@media(min-width:640px){
  #view{padding:20px 20px 28px;}
  .page-head{margin-bottom:18px;}
  .page-title{font-size:1.45rem;}
  .card{padding:18px;}
  .sheet-body{padding:20px 22px;}
  .sheet-foot{padding:14px 22px;}
}

/* ── UX-01: keyboard focus ring for onclick divs ── */
[role="button"]:focus-visible,.card:focus-visible,.row:focus-visible,.email-item:focus-visible,.kpi:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
[role="button"]{cursor:pointer;}

/* ── SEC-10: layout utility classes (replace inline style= in JS templates) ── */
.d-flex{display:flex;}
.ai-c{align-items:center;}
.jc-sb{justify-content:space-between;}
.fw7{font-weight:700;}
.min-w0{min-width:0;}
.f1{flex:1;}
.g9{gap:9px;}
.g10{gap:10px;}
.g11{gap:11px;}
.fs-xs{font-size:.68rem;}
.fs-sm{font-size:.78rem;}
.fs-md{font-size:.82rem;}
.c-gold{color:var(--gold);}
.c-muted{color:var(--muted);}
.c-dim{color:var(--dim);}
.c-cyan{color:var(--cyan);}
.c-text{color:var(--text);}
.op65{opacity:.65;}
.op30{opacity:.3;}
.mt7{margin-top:7px;}
.mb7{margin-bottom:7px;}
.mb8{margin-bottom:8px;}
.p14{padding:14px;}
.w100{width:100%;}
.bb-border2{border-bottom:1px solid var(--border2);}
.pb8{padding-bottom:8px;}

/* ── Improved appbar on desktop ── */
@media(min-width:1024px){
  #appbar{padding-left:28px;padding-right:28px;}
  #barTitle{font-size:1.05rem;}
  .bar-btn{width:40px;height:40px;}
}

<script>

/* Rate limiter — sessionStorage-backed so page refresh cannot bypass it */
const RL={MAX:10,WIN:60000};
function rlOK(){
  const now=Date.now();
  let calls=JSON.parse(sessionStorage.getItem('apexone_rl')||'[]');
  calls=calls.filter(function(t){return now-t<RL.WIN;});
  if(calls.length>=RL.MAX)return false;
  calls.push(now);
  sessionStorage.setItem('apexone_rl',JSON.stringify(calls));
  return true;
}
function sanitize(s,max){
  if(typeof s!=='string')s=String(s==null?'':s);
  s=s.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi,'')
     .replace(/javascript\s*:/gi,'')
     .replace(/on\w+\s*=/gi,'')
     .replace(/<\/?(?:script|object|embed|iframe|frame|link|meta|base)[^>]*>/gi,'')
     .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,'');
  return s.slice(0,max||500).trim();
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function maskKey(k){return(!k||k.length<10)?'':'••••••••'+k.slice(-4);}
async function sha256(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
/* PBKDF2 key-stretched PIN hash — 150k iterations makes brute force impractical */
const PIN_ITER=150000;
async function pinHash(pin,salt,iter){
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:iter||PIN_ITER},key,256);
  return Array.from(new Uint8Array(bits)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function randSalt(){
  var a=new Uint8Array(16);crypto.getRandomValues(a);
  return Array.from(a).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

/* ════ STATE ════ */

  alerts:[],deals:[],contacts:[],courses:[],students:[],cart:[],ordersAcad:[],

  workers:[],shifts:{},tasks:[],certificates:[],compliance:[],hrActions:[],holidays:[],

};
function verifyState(s){
  if(typeof s!=='object'||s===null)return false;
  var required=['alerts','deals','contacts','courses','students','cart','ordersAcad','inventory','inbound','orders','locations','production','workorders','quality','equipment','workers','tasks','certificates','compliance','hrActions','holidays','emails'];
  if(!required.every(function(k){return s[k]===undefined||Array.isArray(s[k]);}))return false;
  return Array.isArray(s.alerts)&&Array.isArray(s.inventory)&&typeof s.settings==='object';
}
/* Overload guards: hard caps per collection + total-size ceiling so storage can never blow up */
const CAPS={alerts:300,deals:500,contacts:1000,courses:200,students:1000,ordersAcad:300,
  inventory:2000,inbound:500,orders:500,locations:500,production:50,workorders:500,

function capCollections(){
  Object.keys(CAPS).forEach(function(k){
    if(Array.isArray(state[k])&&state[k].length>CAPS[k])state[k].length=CAPS[k];
  });
}
function pruneShifts(){
  var cutoff=new Date();cutoff.setDate(cutoff.getDate()-180);
  var cut=cutoff.toISOString().slice(0,10);
  Object.keys(state.shifts).forEach(function(key){
    var d=key.slice(key.indexOf('_')+1);
    if(d<cut)delete state.shifts[key];
  });
}
let _saveTimer=null;
function save(){
  /* Debounce writes: coalesce rapid mutations into one 300ms write */
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_flushSave,300);
}
function _flushSave(){
  try{
    capCollections();
    var json=JSON.stringify(state);
    if(json.length>4.5*1024*1024){
      pruneShifts();
      state.alerts=state.alerts.slice(0,100);
      state.ordersAcad=state.ordersAcad.slice(-50);
      json=JSON.stringify(state);
      if(json.length>4.5*1024*1024){exportData();toast('Storage full — backup downloaded automatically. Reset data to continue.');return;}
    }
    localStorage.setItem(SK,json);
  }catch(e){toast('Storage error: '+e.message);}
}
function load(){
  var raw=localStorage.getItem(SK);
  if(!raw)return;
  try{
    var p=JSON.parse(raw);
    if(!verifyState(p)){toast('Data integrity check failed — using defaults');return;}
    Object.keys(state).forEach(function(k){if(p[k]!==undefined)state[k]=p[k];});
    if(typeof state.shifts!=='object'||state.shifts===null||Array.isArray(state.shifts))state.shifts={};
    pruneShifts();
    capCollections();
    state.rosterOffset=Math.max(-52,Math.min(52,Number(state.rosterOffset)||0));
  }catch(e){toast('Could not load saved data — starting fresh');}
}

let current='home';
let UI={search:{},filter:{}};
let PAGES={};
function navigate(page){
  if(!PAGES[page])page='home';
  if(location.hash!=='#'+page){location.hash=page;return;}
  current=page;
  haptic();
  closeAllSheets();
  var mod=MODULES.find(function(m){return m.id===page;});
  $('barTitle').textContent=mod?mod.l==='Home'?BRAND.name:mod.l:BRAND.name;
  PAGES[page]();
  window.scrollTo(0,0);
  document.querySelectorAll('.nav-tab').forEach(function(t){
    var n=t.getAttribute('data-nav');
    t.classList.toggle('active',n===page||(n==='modules'&&['home','alerts'].indexOf(page)<0));
  });
  document.querySelectorAll('.side-link').forEach(function(l){
    l.classList.toggle('active',l.getAttribute('data-side')===page);
  });
  updateBadges();
}
function a11yFix(){
  document.querySelectorAll('[onclick]').forEach(function(el){
    if(el.tagName==='BUTTON'||el.tagName==='A'||el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA')return;
    if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0');
    if(!el.getAttribute('role'))el.setAttribute('role','button');
  });
}
function rerender(){if(PAGES[current])PAGES[current]();updateBadges();a11yFix();}
function updateBadges(){
  var unread=state.alerts.filter(function(a){return!a.read;}).length;
  var b=$('alertBadge');
  b.style.display=unread?'flex':'none';b.textContent=unread;
  var cartN=state.cart.reduce(function(s,c){return s+c.qty;},0);

function listPage(o){
  var q=(UI.search[o.id]||'').toLowerCase();
  var f=UI.filter[o.id]||'all';
  var list=state[o.col].filter(function(it){
    if(q&&!o.searchText(it).toLowerCase().includes(q))return false;
    if(f!=='all'&&o.filterFn&&!o.filterFn(it,f))return false;
    return true;

  if(o.sort)list=list.slice().sort(o.sort);

    return'<button class="chip'+(f===c.v?' active':'')+'" onclick="setFilter(\''+o.id+'\',\''+c.v+'\')">'+esc(c.l)+'</button>';

/* ════ DELETE + UNDO ════ */
/* Bounded undo stack — max 5 entries so rapid deletes don't silently lose earlier undo targets */
var UNDO_STACK=[];
var UNDO_MAX=5;
function delItem(col,id){
  var idx=state[col].findIndex(function(x){return x.id===id;});
  if(idx<0)return;
  UNDO_STACK.unshift({col:col,item:state[col][idx],idx:idx});
  if(UNDO_STACK.length>UNDO_MAX)UNDO_STACK.length=UNDO_MAX;
  state[col].splice(idx,1);
  save();haptic();rerender();
  var snap=UNDO_STACK[0];
  toast('Deleted','Undo',function(){
    if(!snap)return;
    state[snap.col].splice(Math.min(snap.idx,state[snap.col].length),0,snap.item);
    UNDO_STACK=UNDO_STACK.filter(function(u){return u!==snap;});
    save();rerender();
  });
}

/* ════ TOAST ════ */
function toast(msg,actionLabel,actionFn){
  var t=document.createElement('div');
  t.className='toast';
  /* cap visible toasts so rapid actions can never flood the screen */
  var box=$('toasts');
  while(box.children.length>=3)box.firstChild.remove();
  t.innerHTML='<span>'+esc(msg)+'</span>';
  if(actionLabel){
    var b=document.createElement('button');
    b.textContent=actionLabel;
    b.onclick=function(){actionFn();t.remove();};
    t.appendChild(b);
  }
  $('toasts').appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(function(){t.remove();},320);},3200);
}

/* ════ SHEETS ════ */
let _sheetPrevFocus=null;
let _trapHandler=null;
function openSheet(id){
  closeAllSheets(true);
  $('veil').classList.add('open');
  var sheet=$(id);
  sheet.classList.add('open');
  haptic();
  _sheetPrevFocus=document.activeElement;
  /* Focus first interactive element after animation */
  setTimeout(function(){
    var focusable=sheet.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
    if(focusable.length)focusable[0].focus();
    /* Trap focus inside sheet */
    if(_trapHandler)document.removeEventListener('keydown',_trapHandler);
    _trapHandler=function(e){
      if(e.key!=='Tab')return;
      var els=Array.from(sheet.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
      if(!els.length)return;
      var first=els[0],last=els[els.length-1];
      if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
      else{if(document.activeElement===last){e.preventDefault();first.focus();}}
    };
    document.addEventListener('keydown',_trapHandler);
    /* Close on Escape */
    sheet._escHandler=function(e){if(e.key==='Escape')closeAllSheets();};
    document.addEventListener('keydown',sheet._escHandler);
  },50);
}
function closeAllSheets(keepVeil){
  document.querySelectorAll('.sheet').forEach(function(s){
    if(s._escHandler){document.removeEventListener('keydown',s._escHandler);s._escHandler=null;}
    s.classList.remove('open');
  });
  if(!keepVeil)$('veil').classList.remove('open');
  if(_trapHandler){document.removeEventListener('keydown',_trapHandler);_trapHandler=null;}
  if(_sheetPrevFocus){try{_sheetPrevFocus.focus();}catch(e){}  _sheetPrevFocus=null;}
}

function cycleTask(id){
  var t=state.tasks.find(function(x){return x.id===id;});

  save();haptic();rerender();
}

function moveStage(col,id,key,dir){
  var stages=col==='deals'?CRM_STAGES:ORD_STAGES;
  var it=state[col].find(function(x){return x.id===id;});
  if(!it)return;
  var i=stages.indexOf(it[key])+dir;
  if(i<0||i>=stages.length)return;
  it[key]=stages[i];
  save();haptic();rerender();
}
function dropStage(ev,st){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  if(!_drag)return;
  var it=state[_drag.col].find(function(x){return x.id===_drag.id;});
  if(it){it[_drag.key]=st;save();rerender();}
  _drag=null;
}

function addToCart(id){
  var c=state.courses.find(function(x){return x.id===id;});
  if(!c)return;
  var ex=state.cart.find(function(x){return x.id===id;});
  if(ex)ex.qty++;else state.cart.push({id:id,qty:1,price:c.price});
  save();haptic();rerender();
}
function adjCart(id,d){
  var i=state.cart.findIndex(function(x){return x.id===id;});
  if(i<0)return;
  state.cart[i].qty+=d;
  if(state.cart[i].qty<=0)state.cart.splice(i,1);
  save();haptic();rerender();
}
function checkout(){
  var total=state.cart.reduce(function(s,c){return s+c.price*c.qty;},0);
  state.ordersAcad.push({id:uid('ORD'),date:today(),items:state.cart.slice(),total:total,status:'complete'});
  state.cart=[];
  save();rerender();
  toast('Order placed — '+money(total));
}

function adjStock(id,d){

function raisePO(id){
  var i=state.inventory.find(function(x){return x.id===id;});
  if(!i)return;
  var need=Math.max(i.reorder*2-i.qty,i.reorder);
  state.inbound.push({id:uid('PO'),po:uid('PO-2026'),supplier:i.supplier,expected:today(),arrived:'',status:'pending',lines:i.sku+' x'+need,value:need});
  save();toast('PO raised for '+i.name,'View',function(){navigate('inbound');});rerender();
}

    +'<div class="mstat"><div class="v">'+p.target+'</div><div class="l">Tgt/hr</div></div><div class="mstat"><div class="v" id="act-'+p.id+'">'+p.actual+'</div><div class="l">Act/hr</div></div><div class="mstat"><div class="v">'+p.good.toLocaleString()+'</div><div class="l">Good</div></div></div></div>'
    +'<div class="row-acts"><button class="btn btn-sec btn-sm" onclick="cycleLine(\''+p.id+'\')">'+icon('refresh','sm')+' Status</button><button class="btn btn-sec btn-sm" onclick="openForm(\'production\',\''+p.id+'\')">'+icon('edit','sm')+' Edit</button><button class="btn btn-danger btn-sm" onclick="delItem(\'production\',\''+p.id+'\')">'+icon('trash','sm')+'</button></div></div>';
  }).join('');

    +'<div class="machine-grid">'+cards+'</div>';
};
function cycleLine(id){
  var p=state.production.find(function(x){return x.id===id;});
  if(!p)return;
  p.status={running:'idle',idle:'maintenance',maintenance:'down',down:'running'}[p.status]||'running';
  if(p.status!=='running'){p.actual=0;p.oee=0;}
  else{p.actual=Math.round(p.target*0.8);p.oee=75;}

var SHIFTS=['','D','E','N','OFF','AL','TRN'];
var SHIFT_C={D:'#00c8ff',E:'#d4a23c',N:'#8b5cf6',OFF:'#3a4d6e',AL:'#00e87a',TRN:'#ff6b35'};
PAGES.roster=function(){
  var t0=new Date();t0.setHours(0,0,0,0);
  var start=new Date(t0);start.setDate(t0.getDate()+state.rosterOffset*7);
  var days=[];for(var i=0;i<14;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(d);}
  var f=UI.filter.roster||'all';
  var workers=state.workers.filter(function(w){return f==='all'||w.dept===f;});
  var depts=Array.from(new Set(state.workers.map(function(w){return w.dept;}))).sort();
  var head='<tr><th style="text-align:left">Employee</th>'+days.map(function(d){
    var isT=d.getTime()===t0.getTime();
    return'<th style="'+(isT?'color:var(--cyan)':'')+'">'+['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</th>';
  }).join('')+'</tr>';
  var rows=workers.map(function(w){
    var cells=days.map(function(d){
      var key=w.id+'_'+d.toISOString().slice(0,10);
      var s=state.shifts[key]||'';
      var c=SHIFT_C[s];
      return'<td><div class="shift-cell" style="'+(c?'background:'+c+'22;border-color:'+c+';color:'+c:'')+'" onclick="cycleShift(\''+w.id+'\',\''+d.toISOString().slice(0,10)+'\')">'+(s||'·')+'</div></td>';
    }).join('');
    return'<tr><td><div class="roster-person"><div style="min-width:0"><div class="rname">'+esc(w.name)+'</div><div class="rdept">'+esc(w.dept)+'</div></div>'
      +'<div class="roster-actions"><button class="btn btn-icon btn-sm" aria-label="Edit '+esc(w.name)+'" onclick="openForm(\'workers\',\''+w.id+'\')">'+icon('edit','sm')+'</button>'
      +'<button class="btn btn-icon btn-sm roster-remove" aria-label="Remove '+esc(w.name)+'" onclick="removeRosterEmployee(\''+w.id+'\')">'+icon('trash','sm')+'</button></div></div></td>'+cells+'</tr>';
  }).join('');
  var legend=Object.keys(SHIFT_C).map(function(k){
    return'<span style="display:inline-flex;align-items:center;gap:4px;font-size:.64rem;color:var(--muted)"><span style="width:14px;height:11px;border-radius:3px;background:'+SHIFT_C[k]+'22;border:1px solid '+SHIFT_C[k]+'"></span>'+k+'</span>';
  }).join(' ');
  var range=fmtD(days[0].toISOString().slice(0,10))+' – '+fmtD(days[13].toISOString().slice(0,10));
  $('view').innerHTML=pageHead('Roster & Shifts','calendar','Tap a cell to cycle: Day · Early · Night · Off · Leave · Training',
    '<button class="btn btn-primary btn-sm" onclick="openForm(\'workers\')">'+icon('plus','sm')+' New Employee</button>')
    +'<div class="chips"><button class="chip'+(f==='all'?' active':'')+'" onclick="setFilter(\'roster\',\'all\')">All</button>'
    +depts.map(function(d){return'<button class="chip'+(f===d?' active':'')+'" onclick="setFilter(\'roster\',\''+esc(d)+'\')">'+esc(d)+'</button>';}).join('')+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">'
    +'<button class="btn btn-icon" onclick="state.rosterOffset--;save();rerender()">'+icon('left')+'</button>'
    +'<span class="mono" style="font-size:.72rem;color:var(--muted);flex:1;text-align:center">'+range+'</span>'
    +'<button class="btn btn-icon" onclick="state.rosterOffset++;save();rerender()">'+icon('right')+'</button>'
    +'<button class="btn btn-sec btn-sm" onclick="state.rosterOffset=0;save();rerender()">Today</button>'
    +'<button class="btn btn-success btn-sm" onclick="autoFillRoster()">'+icon('zap','sm')+' Auto-fill</button>'
    +'<button class="btn btn-sec btn-sm" onclick="exportRosterCSV()">'+icon('download','sm')+' CSV</button></div>'
    +'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px">'+legend+'</div>'
    +'<div class="roster-scroll"><table class="roster-tbl"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
};
function removeRosterEmployee(id){
  var w=state.workers.find(function(x){return x.id===id;});
  if(!w)return;
  toast('Remove '+w.name+' from roster?','CONFIRM',function(){
    state.workers=state.workers.filter(function(x){return x.id!==id;});
    Object.keys(state.shifts).forEach(function(k){if(k.indexOf(id+'_')===0)delete state.shifts[k];});
    save();haptic();rerender();
    toast(w.name+' removed from roster');
  });
}
function cycleShift(wid,date){
  var key=wid+'_'+date;
  var i=SHIFTS.indexOf(state.shifts[key]||'');
  var next=SHIFTS[(i+1)%SHIFTS.length];
  if(next)state.shifts[key]=next;else delete state.shifts[key];
  save();haptic();rerender();
}
function autoFillRoster(){
  var t0=new Date();t0.setHours(0,0,0,0);
  var start=new Date(t0);start.setDate(t0.getDate()+state.rosterOffset*7);
  var pats=[['D','D','D','D','D','OFF','OFF'],['N','N','N','N','OFF','OFF','D'],['E','E','D','D','OFF','OFF','E']];
  state.workers.forEach(function(w,wi){
    for(var i=0;i<14;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);
      var key=w.id+'_'+d.toISOString().slice(0,10);
      if(!state.shifts[key])state.shifts[key]=pats[wi%pats.length][d.getDay()%7];
    }
  });
  save();toast('Roster auto-filled for 2 weeks');rerender();
}
function exportRosterCSV(){
  var t0=new Date();t0.setHours(0,0,0,0);
  var start=new Date(t0);start.setDate(t0.getDate()+state.rosterOffset*7);
  var days=[];for(var i=0;i<14;i++){var d=new Date(start);d.setDate(start.getDate()+i);days.push(d.toISOString().slice(0,10));}
  var csv='Employee,Dept,'+days.join(',')+'\n'+state.workers.map(function(w){
    return[w.name,w.dept].concat(days.map(function(dd){return state.shifts[w.id+'_'+dd]||'';})).join(',');
  }).join('\n');
  dlFile('roster.csv',csv,'text/csv');
}
function dlFile(name,content,type){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type||'application/octet-stream'}));
  a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

PAGES.analytics=function(){
  var dealVal=state.deals.reduce(function(s,d){return s+d.value;},0);
  var wonVal=state.deals.filter(function(d){return d.stage==='won';}).reduce(function(s,d){return s+d.value;},0);
  var acadRev=state.ordersAcad.reduce(function(s,o){return s+o.total;},0);
  var byStage=CRM_STAGES.map(function(st){return{l:CRM_L[st],v:state.deals.filter(function(d){return d.stage===st;}).length,c:'var(--cyan)'};});

function importData(e){
  var f=e.target.files[0];
  if(!f)return;
  /* Reset the input so the same file can be re-imported */
  e.target.value='';
  if(f.type&&f.type!=='application/json'&&!f.name.endsWith('.json')){toast('Please select a .json backup file');return;}
  if(f.size>10*1024*1024){toast('Import rejected — file too large (max 10 MB)');return;}
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var parsed=JSON.parse(ev.target.result);
      /* Support both legacy (raw state) and v2 (wrapped) backup formats */
      var d=parsed.version===2&&parsed.data?parsed.data:parsed;
      if(!verifyState(d)){toast('Import rejected — invalid workspace structure');return;}
      var exportedAt=parsed.exportedAt?new Date(parsed.exportedAt).toLocaleString('en-GB'):'unknown date';
      var _importD=d,_importAt=exportedAt;
      toast('Restore backup from '+exportedAt+'?','CONFIRM',function(){
        var cleaned=JSON.parse(JSON.stringify(_importD).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/javascript\s*:/gi,'').replace(/on\w+\s*=/gi,''));
        Object.keys(state).forEach(function(k){if(cleaned[k]!==undefined)state[k]=cleaned[k];});
        pruneShifts();capCollections();
        save();applyTheme();toast('Backup restored successfully');rerender();
      });
    }catch(err){toast('Import failed — file may be corrupted');}
  };
  r.onerror=function(){toast('Could not read file');};
  r.readAsText(f);
}
function resetData(){
  toast('Reset all demo data?','CONFIRM',function(){
    Object.keys(SEED).forEach(function(k){state[k]=JSON.parse(JSON.stringify(SEED[k]));});
    state.shifts={};state.cart=[];state.ordersAcad=[];
    save();rerender();toast('Demo data restored');
  });
}

let formCtx=null;
function openForm(formKey,id){
  var cfg=FORMS[formKey];
  if(!cfg)return;
  var item=id?state[cfg.col].find(function(x){return x.id===id;}):null;
  var work=item?JSON.parse(JSON.stringify(item)):{};
  if(item&&cfg.hydrate)cfg.hydrate(work);
  formCtx={cfg:cfg,id:id||null};
  $('formTitle').innerHTML=icon(id?'edit':'plus')+' '+(id?'Edit ':'New ')+esc(cfg.t);
  $('formBody').innerHTML=cfg.f.map(function(f){
    var val=work[f.k]!==undefined?work[f.k]:(f.d!==undefined?f.d:'');
    var inner;
    if(f.t==='select'){
      var opts=typeof f.o==='function'?f.o():f.o;
      inner='<select id="ff-'+f.k+'">'+(f.req?'':'<option value="">—</option>')+opts.map(function(op){
        var v=typeof op==='object'?op.v:op,l=typeof op==='object'?op.l:op;
        return'<option value="'+esc(v)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(l)+'</option>';
      }).join('')+'</select>';
    }else if(f.t==='textarea'){
      inner='<textarea id="ff-'+f.k+'">'+esc(val)+'</textarea>';
    }else{
      inner='<input id="ff-'+f.k+'" type="'+(f.t==='num'?'number':f.t==='date'?'date':'text')+'" value="'+esc(val)+'"'+(f.t==='num'?' inputmode="decimal" step="any"':'')+'>';
    }
    return'<div class="f-group"><label class="f-label" for="ff-'+f.k+'">'+esc(f.l)+(f.req?' *':'')+'</label>'+inner+'</div>';
  }).join('');
  openSheet('formSheet');
}
function submitForm(){
  if(!formCtx)return;
  var cfg=formCtx.cfg;
  var isNew=!formCtx.id;
  var obj=isNew?{id:uid(cfg.p)}:JSON.parse(JSON.stringify(state[cfg.col].find(function(x){return x.id===formCtx.id;})||{}));
  for(var i=0;i<cfg.f.length;i++){
    var f=cfg.f[i];
    var el=$('ff-'+f.k);
    if(!el)continue;
    var v=f.t==='num'?(parseFloat(el.value)||0):sanitize(el.value,f.t==='textarea'?2000:300);
    if(f.req&&(v===''||(f.t==='num'&&el.value===''))){toast(f.l+' is required');return;}
    obj[f.k]=v;
  }
  if(cfg.pre)cfg.pre(obj,isNew);
  if(isNew)state[cfg.col].unshift(obj);
  else{
    var idx=state[cfg.col].findIndex(function(x){return x.id===formCtx.id;});
    if(idx>=0)state[cfg.col][idx]=obj;
  }
  save();haptic();closeAllSheets();
  toast(cfg.t+(isNew?' created':' updated'));
  rerender();
}

function sendEmail(){
  var to=($('em-to')||{}).value||'';
  var subject=($('em-subject')||{}).value||'';
  var body=($('em-body')||{}).value||'';
  if(!to.trim()){toast('Please add a recipient');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to.trim())){toast('Invalid email address — check the To field');return;}
  if(!subject.trim()){toast('Please add a subject');return;}
  var em={
    id:uid('EM'),
    folder:'sent',
    from:'manager@apex.com',
    fromName:state.settings.name||'Manager',
    to:sanitize(to,200),
    subject:sanitize(subject,200),
    body:sanitize(body,4000),
    date:new Date().toISOString(),
    read:true,
    priority:'med'
  };
  if(!Array.isArray(state.emails))state.emails=[];
  state.emails.unshift(em);
  save();
  closeAllSheets();
  haptic();
  toast('Email sent to '+em.to,'View',function(){_emailView=em.id;setFilter('email','sent');navigate('email');});
}

function deleteEmail(id){
  var email=state.emails.find(function(e){return e.id===id;});
  if(!email)return;
  var wasView=_emailView===id;
  state.emails=state.emails.filter(function(e){return e.id!==id;});
  if(wasView)_emailView=null;
  save();haptic();navigate('email');
  toast('Email deleted','Undo',function(){
    state.emails.unshift(email);
    save();rerender();
  });
}

async function sendCopilot(msgOverride){
  var inp=$('copInput');
  var msg=sanitize(msgOverride||inp.value,1000);
  if(!msg)return;
  inp.value='';
  if(!navigator.onLine){appendCop('bot','You are offline. Connect to the internet to use the AI Copilot.');return;}
  if(!rlOK()){appendCop('bot','Rate limit reached (10 requests/min). Please wait a moment.');return;}
  appendCop('user',msg);
  copMsgs.push({role:'user',content:msg.slice(0,4000)});
  if(copMsgs.length>40)copMsgs=copMsgs.slice(-24);
  var think=appendCop('think','Thinking...');
  var safeMsgs=copMsgs.slice(-12).map(function(m){
    return{role:m.role==='assistant'?'assistant':'user',content:String(m.content||'').slice(0,4000)};
  });
  var systemPrompt='You are the APEX ONE AI Copilot inside a mobile enterprise command app covering CRM, warehouse, production/OEE, e-learning academy, workforce and compliance. Be concise, direct and actionable - short answers suit a phone screen. '+copilotContext();

  fetch('/api/copilot',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system:systemPrompt,messages:safeMsgs,model:'claude-sonnet-4-6',max_tokens:1024})
  }).then(function(r){
    if(!r.ok){return r.json().then(function(e){throw new Error((e.error&&e.error.message)||'API error '+r.status);}).catch(function(){throw new Error('API error '+r.status);});}
    return r.json();
  }).then(function(d){
    think.remove();
    if(d.error){appendCop('bot','API error: '+esc(d.error.message));return;}
    var reply=(d.content&&d.content[0]&&d.content[0].text)||'No response';
    copMsgs.push({role:'assistant',content:reply});
    appendCop('bot',reply);
  }).catch(function(err){
    think.remove();
    appendCop('bot','AI Copilot is not configured on this deployment. Add ANTHROPIC_API_KEY in Netlify and redeploy.');
    console.error('Copilot error:',err);
  });
}function openCopilot(){
  openSheet('copilotSheet');

    appendCop('bot','Hi '+state.settings.name+' — I can summarise alerts, suggest priorities, or answer questions about your live operations. What do you need?');

      return'<button class="chip" onclick="sendCopilot(\''+s.replace(/'/g,"\\'")+'\')">'+esc(s)+'</button>';
    }).join('');
  }
}

/* ════ API KEY ENCRYPTION ════
   API key is encrypted with AES-GCM using a key derived from the PIN.
   The raw key never touches localStorage — only the encrypted blob does.
   When no PIN is set, the key falls back to plaintext (same as before).
   _encKey holds the CryptoKey in memory for the current session only.     */
var _encKey=null;
const EK='apexone_api_enc'; /* encrypted API key storage key */

async function deriveEncKey(pin,salt){
  /* Derive a 256-bit AES-GCM key from the PIN using PBKDF2 (separate from auth hash) */
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('apexenc:'+salt),iterations:PIN_ITER},
    raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptApiKey(plainKey,encKey){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},encKey,new TextEncoder().encode(plainKey));
  return JSON.stringify({iv:Array.from(iv),ct:Array.from(new Uint8Array(ct))});
}
async function decryptApiKey(blob,encKey){
  try{
    const {iv,ct}=JSON.parse(blob);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(iv)},encKey,new Uint8Array(ct));
    return new TextDecoder().decode(plain);
  }catch(e){return null;}
}
/* Read API key — returns plaintext regardless of storage format */
async function getApiKey(){
  if(_encKey){
    const enc=localStorage.getItem(EK);
    if(enc)return decryptApiKey(enc,_encKey);
  }
  /* Fallback: unencrypted (no PIN set, or session just started) */
  return localStorage.getItem('apexone_api');
}
/* Write API key — encrypts if PIN+encKey available, else stores plaintext */
async function storeApiKey(plainKey){
  if(_encKey){
    localStorage.setItem(EK,await encryptApiKey(plainKey,_encKey));
    localStorage.removeItem('apexone_api'); /* migrate away from plaintext */
  }else{
    localStorage.setItem('apexone_api',plainKey);
    localStorage.removeItem(EK);
  }
}
async function removeApiKey(){
  _encKey=null;
  localStorage.removeItem('apexone_api');
  localStorage.removeItem(EK);
}
/* Called at unlock — migrate existing plaintext key to encrypted storage */
async function migrateApiKeyToEncrypted(encKey){
  const plain=localStorage.getItem('apexone_api');
  if(plain&&plain.startsWith('sk-ant-')){
    localStorage.setItem(EK,await encryptApiKey(plain,encKey));
    localStorage.removeItem('apexone_api');
  }
}


let pinBuf='';
function buildPinPad(){
  var keys=['1','2','3','4','5','6','7','8','9','C','0','⌫'];
  var labels={'C':'Clear PIN','⌫':'Backspace','0':'Digit 0','1':'Digit 1','2':'Digit 2','3':'Digit 3','4':'Digit 4','5':'Digit 5','6':'Digit 6','7':'Digit 7','8':'Digit 8','9':'Digit 9'};
  $('pinPad').innerHTML=keys.map(function(k){
    var lbl=labels[k]?(' aria-label="'+labels[k]+'"'):'';
    return'<button class="pin-key" data-pk="'+k+'"'+lbl+'>'+k+'</button>';
  }).join('');
  $('pinPad').querySelectorAll('.pin-key').forEach(function(b){
    b.addEventListener('click',function(){pinPress(b.getAttribute('data-pk'));});
  });
}
function pinPress(k){
  haptic();
  if(k==='C')pinBuf='';
  else if(k==='⌫')pinBuf=pinBuf.slice(0,-1);
  else if(pinBuf.length<4)pinBuf+=k;
  renderPinDots();
  if(pinBuf.length===4)checkPin();
}
function renderPinDots(){
  var dots=$('pinDots').children;
  for(var i=0;i<4;i++)dots[i].classList.toggle('fill',i<pinBuf.length);
}
/* Brute-force lockout: 5 free attempts, then exponential cool-down (30s, 60s, 120s…) */
const FK='apexone_pinfail';
function pinLockout(){
  var f=JSON.parse(localStorage.getItem(FK)||'{"n":0,"until":0}');
  return f.until>Date.now()?Math.ceil((f.until-Date.now())/1000):0;
}
function pinFail(){
  var f=JSON.parse(localStorage.getItem(FK)||'{"n":0,"until":0}');
  f.n++;
  if(f.n>=5)f.until=Date.now()+30000*Math.pow(2,Math.min(f.n-5,6));
  localStorage.setItem(FK,JSON.stringify(f));
  return f;
}
async function checkPin(){
  var stored=JSON.parse(localStorage.getItem(PK)||'null');
  if(!stored){unlock();return;}
  var wait=pinLockout();
  if(wait){
    $('lockMsg').textContent='Too many attempts — locked for '+wait+'s';
    pinBuf='';renderPinDots();
    return;
  }
  var entered=pinBuf;
  pinBuf='';renderPinDots();
  $('lockMsg').textContent='Checking…';
  var ok;
  if(stored.v===2){
    ok=(await pinHash(entered,stored.salt,stored.iter))===stored.hash;
  }else{
    /* legacy single-round hash — verify, then upgrade in place to PBKDF2 */
    ok=(await sha256(stored.salt+entered))===stored.hash;
    if(ok){
      var salt=randSalt();
      localStorage.setItem(PK,JSON.stringify({v:2,salt:salt,iter:PIN_ITER,hash:await pinHash(entered,salt,PIN_ITER)}));
    }
  }
  if(ok){
    localStorage.removeItem(FK);
    /* Derive AES-GCM encryption key from PIN and migrate any plaintext API key */
    deriveEncKey(entered,stored.salt).then(function(ek){
      _encKey=ek;
      migrateApiKeyToEncrypted(ek);
    });
    unlock();
  }else{
    var f=pinFail();
    var w=pinLockout();
    $('lockMsg').textContent=w?'Too many attempts — locked for '+w+'s':'Wrong PIN — '+(5-f.n)+' attempt'+(5-f.n===1?'':'s')+' left';
    if(navigator.vibrate)try{navigator.vibrate([60,40,60]);}catch(e){}
  }
}
function unlock(){pinBuf='';renderPinDots();$('lockScreen').classList.remove('show');lastActive=Date.now();}
function lockNow(){
  if(!localStorage.getItem(PK))return;
  _encKey=null;
  pinBuf='';renderPinDots();
  $('lockMsg').textContent='Enter your PIN to unlock';
  $('lockScreen').classList.add('show');
}
async function setupPin(){
  formCtx=null;
  $('formTitle').innerHTML=icon('key')+' Set up PIN lock';
  $('formBody').innerHTML='<div class="f-group"><label class="f-label">New 4-digit PIN</label><input id="pinA" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off"></div>'
    +'<div class="f-group"><label class="f-label">Confirm PIN</label><input id="pinB" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off"></div>'
    +'<div class="row-sub">'+icon('shield','sm')+' Stored on this device only as a salted PBKDF2 hash (150,000 rounds). 5 wrong attempts triggers a cool-down.</div>';
  $('formSave').onclick=async function(){
    var a=$('pinA').value,b=$('pinB').value;
    if(!/^\d{4}$/.test(a)){toast('PIN must be exactly 4 digits');return;}
    if(/^(\d)\1{3}$|^(0123|1234|2345|3456|4567|5678|6789|9876|8765|7654|6543|5432|4321|3210|2580|0852)$/.test(a)){toast('PIN too easy to guess — pick another');return;}
    if(a!==b){toast('PINs do not match');return;}
    var salt=randSalt();
    localStorage.setItem(PK,JSON.stringify({v:2,salt:salt,iter:PIN_ITER,hash:await pinHash(a,salt,PIN_ITER)}));
    localStorage.removeItem(FK);
    /* Derive enc key from new PIN — re-encrypt any existing API key */
    _encKey=await deriveEncKey(a,salt);
    await migrateApiKeyToEncrypted(_encKey);
    closeAllSheets();
    $('formSave').onclick=submitForm;
    toast('PIN lock enabled');rerender();
  };
  openSheet('formSheet');
}
function removePin(){
  toast('Remove PIN lock?','CONFIRM',function(){
    localStorage.removeItem(PK);
    localStorage.removeItem(EK);
    _encKey=null;
    toast('PIN lock removed');rerender();
  });
}
let lastActive=Date.now();
['click','touchstart','keydown','scroll'].forEach(function(ev){
  document.addEventListener(ev,function(){lastActive=Date.now();},{passive:true});
});
setInterval(function(){
  if(localStorage.getItem(PK)&&!$('lockScreen').classList.contains('show')&&Date.now()-lastActive>10*60*1000)lockNow();
},30000);

/* ════ LIVE TICKER — nothing static ════ */
var _tickerDirty=false;
setInterval(function(){
  var changed=false;
  state.production.forEach(function(p){
    if(p.status!=='running')return;
    var jit=Math.round((Math.random()-0.45)*10);
    p.actual=Math.max(0,Math.min(Math.round(p.target*1.05),p.actual+jit));
    var made=Math.max(0,Math.round(p.actual/720));
    p.good+=made;p.total+=made;
    /* bound the counters so the live feed can never overflow */
    if(p.total>99999999){p.good=Math.round(p.good/2);p.total=Math.round(p.total/2);}
    var perf=p.target?Math.min(1,p.actual/p.target):0;
    var qual=p.total?p.good/p.total:1;
    p.oee=Math.round(p.uptime/100*perf*qual*100);
    changed=true;
  });
  if(!changed)return;
  _tickerDirty=true;
  var sheetOpen=document.querySelector('.sheet.open');
  var typing=document.activeElement&&['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName)>=0;
  if(!sheetOpen&&!typing&&['home','production','analytics'].indexOf(current)>=0)rerender();
},5000);
/* Flush ticker mutations to localStorage every 60 s — avoids a write every 5 s */
setInterval(function(){if(_tickerDirty){_tickerDirty=false;save();}},60000);

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredInstall=e;
  if(!localStorage.getItem('apexone_nobanner'))$('installBanner').classList.add('show');
});
function triggerInstall(){
  if(deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){deferredInstall=null;$('installBanner').classList.remove('show');});
  }else{
    toast('Use your browser menu → “Add to Home Screen”');
  }
}
window.addEventListener('appinstalled',function(){
  $('installBanner').classList.remove('show');

function netStatus(){

}

/* UX-01: keyboard activation for onclick divs (Enter / Space) */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var el=e.target;
  if(el.tagName==='BUTTON'||el.tagName==='A'||el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA')return;
  if(el.getAttribute('role')==='button'||el.hasAttribute('onclick')){e.preventDefault();el.click();}
});
window.addEventListener('offline',function(){netStatus();toast('Offline — changes are saved locally');});

/* ════ OBSERVABILITY ════ */
var _OBS_KEY='apexone_obs';
var _obsInit=(function(){try{return JSON.parse(localStorage.getItem(_OBS_KEY)||'[]');}catch(e){return[];}}());
const OBS={errors:_obsInit,MAX_ERRORS:20};
function _obsPersist(){try{localStorage.setItem(_OBS_KEY,JSON.stringify(OBS.errors));}catch(e){}}
/* Global error boundary — catches unhandled JS errors */
window.addEventListener('error',function(e){
  var entry={t:Date.now(),msg:e.message||'Unknown error',file:e.filename?e.filename.split('/').pop():'',line:e.lineno,col:e.colno};
  OBS.errors.unshift(entry);
  if(OBS.errors.length>OBS.MAX_ERRORS)OBS.errors.length=OBS.MAX_ERRORS;
  _obsPersist();
  console.error('[APEX ONE] Uncaught error:',e.message,'at',e.filename+':'+e.lineno);
  /* Show user-friendly toast for non-script-load errors */
  if(!e.filename||e.filename.includes(location.hostname)){
    toast('Unexpected error — please refresh if anything looks wrong');
  }
});
window.addEventListener('unhandledrejection',function(e){
  var entry={t:Date.now(),msg:'Unhandled promise rejection: '+(e.reason&&e.reason.message||String(e.reason))};
  OBS.errors.unshift(entry);
  if(OBS.errors.length>OBS.MAX_ERRORS)OBS.errors.length=OBS.MAX_ERRORS;
  _obsPersist();
  console.error('[APEX ONE] Unhandled rejection:',e.reason);
});
/* Performance timing — log key metrics to console after page load */
window.addEventListener('load',function(){
  if(!window.performance)return;
  var nav=performance.getEntriesByType('navigation')[0];
  if(nav){
    console.info('[APEX ONE] FCP ~'+Math.round(nav.domContentLoadedEventEnd)+'ms · Load ~'+Math.round(nav.loadEventEnd)+'ms');
  }
});
/* Expose error log for debugging in console: apexDebug() */
window.apexDebug=function(){
  console.table(OBS.errors.slice(0,10));
  console.info('State size:',JSON.stringify(state).length,'bytes');
  console.info('localStorage used:',(localStorage.getItem(SK)||'').length,'bytes');
};

function buildSidebar(){
  var sb=$('sidebar');
  if(!sb)return;
  var secs={};
  MODULES.forEach(function(m){(secs[m.s]=secs[m.s]||[]).push(m);});
  sb.innerHTML=Object.keys(secs).map(function(s){
    return'<div class="side-section">'+esc(s)+'</div>'
      +secs[s].map(function(m){
        var badgeHtml=m.id==='email'?'<span class="side-badge" id="sideEmailBadge" style="display:none">0</span>':'';
        return'<button class="side-link" data-side="'+m.id+'" onclick="navigate(\''+m.id+'\')">'+icon(m.i,'sm')+' '+esc(m.l)+badgeHtml+'</button>';
      }).join('');
  }).join('');
}

  applyBranding();
  load();
  seedIfEmpty();

  buildQuickSheet();
  buildSidebar();

  updateBadges();
  if(localStorage.getItem(PK))lockNow();

  document.querySelectorAll('.nav-tab').forEach(function(t){

  var searchDeb=null;

  var formSave=$('formSave');if(formSave)formSave.onclick=submitForm;
  on('copInput','keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendCopilot();}});
  on('installYes','click',triggerInstall);
  on('installNo','click',function(){localStorage.setItem('apexone_nobanner','1');var banner=$('installBanner');if(banner)banner.classList.remove('show');});
  window.addEventListener('hashchange',function(){navigate(location.hash.slice(1)||'home');});
  /* Show one-time API key hint if copilot has never been configured */
  if(!localStorage.getItem(AK)&&!localStorage.getItem(EK)&&!localStorage.getItem('apexone_keyhint_dismissed')){
    setTimeout(function(){
      toast('Enable AI Copilot — add your API key in Settings','Settings',function(){
        navigate('settings');
        setTimeout(function(){var el=$('setKey');if(el)el.focus();},200);
      });
    },1500);
  }
  navigate(location.hash.slice(1)||'home');
  /* service worker */
  if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    
  }
}
document.addEventListener('DOMContentLoaded',init);

/* Expose globals required by inline HTML event handlers */
bindGlobals();

})();
